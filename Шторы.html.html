<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расчёт стоимости пошива</title>
<style>
*{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;margin:0;padding:10px;background:#EDE9E2;color:#3E3F3D;font-size:14px;}
.container{max-width:1200px;margin:0 auto;}
h1{font-size:18px;margin:0 0 10px;color:#3E3F3D;font-weight:600;letter-spacing:.3px;}
.top-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
input,select,textarea{padding:6px 8px;border:1px solid #C0B5A8;border-radius:4px;font-size:14px;font-family:inherit;background:#FFFDF8;color:#3E3F3D;width:100%;}
input:focus,select:focus{outline:2px solid #6B7A8F;border-color:transparent;}
button{padding:8px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-family:inherit;background:#6B7A8F;color:#fff;font-weight:500;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button:hover{background:#5A6878;}
button.secondary{background:#D8D2C8;color:#3E3F3D;}
button.secondary:hover{background:#C9C1B4;}
button.danger{background:#A8846E;color:#fff;padding:4px 10px;font-size:12px;}
button.danger:hover{background:#8E6E5C;}
button.mini{background:#D8D2C8;color:#3E3F3D;padding:4px 8px;font-size:12px;}
button.mini:hover{background:#C9C1B4;}
button.add-line{background:transparent;color:#6B7A8F;padding:6px 0;font-size:13px;text-align:left;font-weight:500;}
button.add-line:hover{color:#3E3F3D;text-decoration:underline;}
button.green{background:#96A096;}
button.green:hover{background:#7F8A7F;}

.header-block{background:#F7F4EE;border-radius:6px;padding:10px;margin-bottom:10px;box-shadow:0 1px 2px rgba(62,63,61,.06);}
.header-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
.header-grid label{display:block;font-size:11px;color:#8A8578;font-weight:600;margin-bottom:2px;text-transform:uppercase;letter-spacing:.3px;}

.item{background:#FFFDF8;border:1px solid #C0B5A8;border-radius:6px;margin-bottom:12px;overflow:hidden;}
.item-head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#A8B5A3;color:#fff;font-size:14px;font-weight:600;flex-wrap:wrap;}
.item-head select,.item-head input{flex:1;min-width:110px;padding:5px 8px;font-size:13px;font-weight:500;background:#FFFDF8;color:#3E3F3D;border:none;}
.item-head .sep{color:#E6EAE4;font-weight:400;}
.item-head-actions{margin-left:auto;}

.item-info{display:grid;grid-template-columns:100px 100px 1fr;gap:8px;padding:8px 10px;background:#E6EAE4;border-bottom:1px solid #C5CFC1;font-size:13px;align-items:center;}
.item-info .dim{display:flex;align-items:center;gap:4px;}
.item-info label{font-size:11px;color:#5A6855;font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
.item-info input{width:100%;padding:5px 6px;font-size:13px;}
.item-info .autocalc{font-size:11px;color:#5A6855;text-align:right;padding-right:4px;}

.section{background:#FDFBF6;border-bottom:1px solid #E5DFD3;}
.section-head{padding:6px 10px;background:#EDE9E2;font-size:11px;color:#8A8578;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.section-body{padding:0 10px 4px;overflow-x:auto;}
.section-table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px;}
.section-table th{text-align:left;padding:4px 6px;background:transparent;color:#8A8578;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid #D8D2C8;}
.section-table th.num{text-align:right;}
.section-table td{padding:3px 4px;vertical-align:middle;}
.section-table td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500;}
.section-table td.actions{width:40px;text-align:right;}
.row-input{width:100%;padding:5px 6px;font-size:13px;background:#FFFDF8;border:1px solid transparent;border-radius:3px;}
.row-input:hover{border-color:#D8D2C8;}
.row-input:focus{background:#fff;border-color:#6B7A8F;outline:none;}
.row-select{width:100%;padding:5px 6px;font-size:13px;background:#FFFDF8;border:1px solid transparent;border-radius:3px;min-width:200px;}
.row-select:hover{border-color:#D8D2C8;}
.row-select:focus{background:#fff;border-color:#6B7A8F;outline:none;}
.qty-input{width:70px;text-align:right;padding:5px 6px;}
.price-input{width:80px;text-align:right;padding:5px 6px;}

.markups-section{background:#EDE6DC;border-bottom:1px solid #D4C7B5;}
.markups-head{padding:6px 10px;background:#E0D5C4;font-size:11px;color:#7A6B58;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.markups-body{padding:6px 10px;}
.markup-row{display:grid;grid-template-columns:2fr 1fr auto;gap:6px;align-items:center;margin-bottom:4px;font-size:13px;}
.markup-row select{padding:5px 6px;font-size:13px;background:#FFFDF8;}

.item-footer{padding:8px 10px;background:#F7F4EE;border-top:2px solid #A8B5A3;}
.item-footer-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.item-total{margin-left:auto;font-size:16px;font-weight:700;color:#3E3F3D;}

.master-row{display:flex;align-items:center;gap:12px;padding:8px 10px;background:#EDE6DC;border-top:1px solid #D4C7B5;font-size:13px;flex-wrap:wrap;}
.master-row label{font-size:11px;color:#7A6B58;font-weight:600;text-transform:uppercase;}
.master-row select{width:auto;padding:5px 8px;font-size:13px;}
.master-row input[type="checkbox"]{width:auto;}

.totals-block{background:#F7F4EE;border-radius:6px;padding:12px;margin-top:12px;box-shadow:0 1px 2px rgba(62,63,61,.06);}
.totals-row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;}
.totals-row.grand{font-size:20px;font-weight:700;color:#3E3F3D;border-top:2px solid #3E3F3D;margin-top:8px;padding-top:12px;}
.markup-checks{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;padding:8px 0;border-top:1px dashed #C0B5A8;border-bottom:1px dashed #C0B5A8;}
.markup-checks label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;}
.markup-checks input[type="checkbox"]{width:auto;}

.saved-panel{background:#F7F4EE;border-radius:6px;padding:10px;margin-bottom:10px;box-shadow:0 1px 2px rgba(62,63,61,.06);display:none;}
.saved-list{max-height:400px;overflow-y:auto;}
.saved-item{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #E5DFD3;flex-wrap:wrap;}
.saved-item:hover{background:#EDE9E2;}
.saved-info{flex:1;min-width:150px;}
.saved-name{font-weight:600;}
.saved-date{font-size:12px;color:#8A8578;}
.saved-sum{font-weight:600;color:#6B7A8F;white-space:nowrap;}

@media(max-width:700px){
  .header-grid{grid-template-columns:1fr;}
  .item-head select,.item-head input{min-width:100%;}
  .item-info{grid-template-columns:1fr 1fr;}
  .item-info .autocalc{grid-column:1/-1;text-align:left;}
  .markup-row{grid-template-columns:1fr;}
}
</style>
</head>

<div class="container">

<div class="no-print">
  <h1>РАСЧЁТ СТОИМОСТИ ПОШИВА</h1>

  <div class="top-actions">
    <button onclick="newOrder()">Новый расчёт</button>
    <button class="secondary" onclick="showSaved()">Мои расчёты</button>
    <button class="secondary" onclick="saveToCloud()">Сохранить в список</button>
    <button class="secondary" onclick="exportBackup()">Резервная копия</button>
    <button class="secondary" onclick="importBackup()">Восстановить</button>
  </div>

  <div class="saved-panel" id="savedPanel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <b>Мои расчёты</b>
      <button class="mini" onclick="hideSaved()">Закрыть</button>
    </div>
    <div class="saved-list" id="savedList"></div>
  </div>

  <div class="header-block">
    <div class="header-grid">
      <div><label>Номер заказа</label><input type="text" id="orderNum" placeholder="244"></div>
      <div><label>Дата готовности</label><input type="text" id="readyDate" placeholder="15.10.2026"></div>
      <div><label>Дизайнер</label><input type="text" id="designer" placeholder="ФИО"></div>
      <div><label>Проект</label><input type="text" id="projectName" placeholder="Название проекта"></div>
    </div>
  </div>

  <div id="itemsContainer"></div>
  <button onclick="addItem()" style="width:100%;padding:12px;font-size:14px;">+ Добавить изделие</button>

  <div class="totals-block">
    <div class="totals-row"><span>Сумма по изделиям:</span><span id="itemsTotal">0 ₽</span></div>
    <div class="markup-checks">
      <label><input type="checkbox" id="urgency50" onchange="syncHeader();recalc();"> Срочно (3-4 дня) +50%</label>
      <label><input type="checkbox" id="urgency100" onchange="syncHeader();recalc();"> Очень срочно (1-2 дня) +100%</label>
    </div>
    <div class="totals-row" id="markupRow" style="display:none;"><span>Общие наценки:</span><span id="markupsTotal">0 ₽</span></div>
    <div class="totals-row grand"><span>ВСЕГО К ОПЛАТЕ:</span><span id="grandTotal">0 ₽</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button onclick="printDoc()">Печать / PDF</button>
      <button class="green" onclick="printMasters()">Ведомость ЗП</button>
    </div>
  </div>
</div>

</div>

// ==================== СОСТОЯНИЕ ====================
let state = {orderNum:'',readyDate:'',designer:'',projectName:'',items:[],urgency50:false,urgency100:false};
let itemCounter = 0;

// ==================== ИЗДЕЛИЯ ====================
function addItem(){
  state.items.push({
    id: 'i_'+(++itemCounter),
    roomName: 'Гостиная',
    roomCustom: '',
    itemName: '',
    width: '',
    height: '',
    mainLines: [],
    extraLines: [],
    materialLines: [],
    markups: {},
    masterIdx: 0,
    masterCuts: true
  });
  render();
}
function removeItem(id){
  if(!confirm('Удалить изделие?')) return;
  state.items = state.items.filter(i=>i.id!==id);
  render();
}
function getItem(id){ return state.items.find(i=>i.id===id); }
function updateItem(id,f,v){
  const it = getItem(id); if(!it) return;
  it[f] = v;
  if(f==='masterIdx') it.masterCuts = (parseInt(v)===0);
}

// Получить метраж пошива = сумма кол-ва всех строк пошива
function getMainQty(it){
  return (it.mainLines||[]).reduce((s,l)=>s+(parseFloat(l.qty)||0),0);
}

// ==================== СТРОКИ ====================
function addMainLine(id){
  const it = getItem(id); if(!it) return;
  it.mainLines.push({workName:'',qty:1,price:0});
  render();
}
function addExtraLine(id){
  const it = getItem(id); if(!it) return;
  it.extraLines.push({opIdx:0,qty:1});
  render();
}
function addMaterialLine(id){
  const it = getItem(id); if(!it) return;
  it.materialLines.push({matIdx:0,qty:1});
  render();
}
function removeMainLine(id,idx){ const it=getItem(id); if(it){it.mainLines.splice(idx,1);render();} }
function removeExtraLine(id,idx){ const it=getItem(id); if(it){it.extraLines.splice(idx,1);render();} }
function removeMaterialLine(id,idx){ const it=getItem(id); if(it){it.materialLines.splice(idx,1);render();} }

function updateMainLine(id,idx,f,v){
  const it = getItem(id); if(!it || !it.mainLines[idx]) return;
  const l = it.mainLines[idx];
  if(f==='workName'){
    l.workName = v;
    const work = PRICE_MAIN.find(w=>w.name===v);
    if(work) l.price = work.price;
    render(); return;
  }
  if(f==='qty') l.qty = parseFloat(v)||0;
  if(f==='price') l.price = parseFloat(v)||0;
  // Обновляем только суммы, не перерисовывая весь список
  updateLineSums(id, idx, 'main');
}
function updateExtraLine(id,idx,f,v){
  const it = getItem(id); if(!it || !it.extraLines[idx]) return;
  const l = it.extraLines[idx];
  if(f==='opIdx'){
    l.opIdx = parseInt(v);
    const op = OPS[l.opIdx];
    if(op){
      if(op.auto==='vert'){ l.qty = parseFloat(it.height)||0; }
      else if(op.auto==='horiz'){ l.qty = parseFloat(it.width)||0; }
      else if(op.autoTape){ l.qty = getMainQty(it); }
      else if(op.roman==='circles' || op.roman==='assembly'){
        l.qty = (parseFloat(it.width)||0) * (parseFloat(it.height)||0);
      }
      else if(op.decor){
        l.qty = 2 * ((parseFloat(it.width)||0) + (parseFloat(it.height)||0));
      }
    }
    render(); return;
  }
  if(f==='qty') l.qty = parseFloat(v)||0;
  updateLineSums(id, idx, 'extra');
}
function updateMaterialLine(id,idx,f,v){
  const it = getItem(id); if(!it || !it.materialLines[idx]) return;
  const l = it.materialLines[idx];
  if(f==='matIdx'){
    l.matIdx = parseInt(v);
    const mat = MATERIALS[l.matIdx];
    if(mat && mat.tape){ l.qty = getMainQty(it); }
    if(mat && mat.romanTape){ l.qty = getMainQty(it); }
    if(mat && mat.synth){
      l.qty = Math.min(parseFloat(it.width)||0, parseFloat(it.height)||0);
    }
    render(); return;
  }
  if(f==='qty') l.qty = parseFloat(v)||0;
  updateLineSums(id, idx, 'material');
}

// Обновляем только сумму строки и общий итог (не теряем фокус)
function updateLineSums(id, idx, type){
  const it = getItem(id); if(!it) return;
  let lineSum = 0;
  let sumElId = '';
  if(type==='main' && it.mainLines[idx]){
    const l = it.mainLines[idx];
    lineSum = l.price * l.qty;
    sumElId = 'sum_main_'+id+'_'+idx;
  } else if(type==='extra' && it.extraLines[idx]){
    const l = it.extraLines[idx];
    const op = OPS[l.opIdx];
    lineSum = op ? op.price * l.qty : 0;
    sumElId = 'sum_extra_'+id+'_'+idx;
  } else if(type==='material' && it.materialLines[idx]){
    const l = it.materialLines[idx];
    const mat = MATERIALS[l.matIdx];
    lineSum = mat ? mat.price * l.qty : 0;
    sumElId = 'sum_mat_'+id+'_'+idx;
  }
  const el = document.getElementById(sumElId);
  if(el) el.textContent = fmt(lineSum);
  // Обновляем итог по изделию
  const totalEl = document.getElementById('item_total_'+id);
  if(totalEl) totalEl.textContent = fmt(calcItem(it).total);
  // Общий итог
  recalc();
}

// ==================== НАЦЕНКИ ====================
function addMarkup(id){
  const it = getItem(id); if(!it) return;
  const used = Object.keys(it.markups);
  const next = MARKUPS.find(m=>!used.includes(m.id));
  if(!next){ alert('Все наценки уже добавлены'); return; }
  it.markups[next.id] = {base:next.base};
  render();
}
function removeMarkup(id,mid){
  const it = getItem(id); if(!it) return;
  delete it.markups[mid];
  render();
}
function setMarkupBase(id,mid,base){
  const it = getItem(id); if(!it || !it.markups[mid]) return;
  it.markups[mid].base = base;
  render();
}
function changeMarkup(id,oldMid,newMid){
  const it = getItem(id); if(!it || !it.markups[oldMid]) return;
  const curBase = it.markups[oldMid].base;
  delete it.markups[oldMid];
  it.markups[newMid] = {base:curBase};
  render();
}

// ==================== РАСЧЁТ ====================
function fmt(n){ return Math.round(n).toLocaleString('ru-RU')+' ₽'; }

function calcItem(it){
  const r = {
    mainBase:0, mainPctBase:0, mainWithBaseMarkups:0,
    extrasSum:0, materialsSum:0, workVolume:0,
    volumeMarkupsSum:0, volumeMarkupsList:[],
    baseMarkupsList:[], total:0,
    mainLinesData:[], extrasData:[], materialsData:[]
  };

  // 1. Основной пошив
  let mainBase = 0;
  (it.mainLines||[]).forEach(l=>{
    const sum = l.price * l.qty;
    mainBase += sum;
    r.mainLinesData.push({name:l.workName||'—', unit:'м', qty:l.qty, price:l.price, sum});
  });
  r.mainBase = mainBase;

  // 2. Базовые наценки
  let pctBase = 0;
  const baseMarkupsList = [];
  Object.keys(it.markups||{}).forEach(mid=>{
    const val = it.markups[mid];
    const m = MARKUPS.find(x=>x.id===mid);
    if(!m) return;
    if(val.base === 'base'){
      pctBase += m.pct;
      baseMarkupsList.push({id:mid, name:m.name, pct:m.pct});
    }
  });
  const h = parseFloat(it.height)||0;
  if(h > 3.1){
    const extra = Math.floor(h - 3.1);
    const pct = extra * 30;
    pctBase += pct;
    baseMarkupsList.push({name:`Высота >3,1 м (+${pct}%)`,pct});
  }
  r.mainPctBase = pctBase;
  r.mainWithBaseMarkups = mainBase * (1 + pctBase/100);
  r.baseMarkupsList = baseMarkupsList;

  // 3. Доп работы
  let extrasSum = 0;
  (it.extraLines||[]).forEach(l=>{
    const op = OPS[l.opIdx];
    if(op){
      const sum = op.price * l.qty;
      extrasSum += sum;
      r.extrasData.push({name:op.name, unit:op.unit, qty:l.qty, price:op.price, sum});
    }
  });
  r.extrasSum = extrasSum;

  // 4. Фурнитура
  let materialsSum = 0;
  (it.materialLines||[]).forEach(l=>{
    const mat = MATERIALS[l.matIdx];
    if(mat){
      const sum = mat.price * l.qty;
      materialsSum += sum;
      r.materialsData.push({name:mat.name, unit:mat.unit, qty:l.qty, price:mat.price, sum});
    }
  });
  r.materialsSum = materialsSum;

  // 5. Объём работы
  const workVolume = r.mainWithBaseMarkups + extrasSum;
  r.workVolume = workVolume;

  // 6. Наценки от объёма
  let volumeMarkupsSum = 0;
  Object.keys(it.markups||{}).forEach(mid=>{
    const val = it.markups[mid];
    const m = MARKUPS.find(x=>x.id===mid);
    if(!m) return;
    if(val.base === 'volume'){
      const sum = workVolume * m.pct / 100;
      volumeMarkupsSum += sum;
      r.volumeMarkupsList.push({id:mid, name:m.name, pct:m.pct, sum});
    }
  });
  r.volumeMarkupsSum = volumeMarkupsSum;

  r.total = r.mainWithBaseMarkups + extrasSum + materialsSum + volumeMarkupsSum;
  return r;
}

function calcItemsTotal(){ return state.items.reduce((s,it)=>s+calcItem(it).total,0); }

function recalc(){
  const total = calcItemsTotal();
  let mt = 0;
  if(state.urgency50) mt += total * 0.5;
  if(state.urgency100) mt += total * 1.0;
  const e1 = document.getElementById('itemsTotal');
  const e2 = document.getElementById('grandTotal');
  const e3 = document.getElementById('markupsTotal');
  const e4 = document.getElementById('markupRow');
  if(e1) e1.textContent = fmt(total);
  if(e2) e2.textContent = fmt(total + mt);
  if(e3) e3.textContent = fmt(mt);
  if(e4) e4.style.display = mt > 0 ? 'flex' : 'none';
}

function syncHeader(){
  state.orderNum = document.getElementById('orderNum').value;
  state.readyDate = document.getElementById('readyDate').value;
  state.designer = document.getElementById('designer').value;
  state.projectName = document.getElementById('projectName').value;
  state.urgency50 = document.getElementById('urgency50').checked;
  state.urgency100 = document.getElementById('urgency100').checked;
}
// ==================== РЕНДЕР ====================
function render(){
  const c = document.getElementById('itemsContainer');
  if(!c) return;
  if(state.items.length === 0){ c.innerHTML = ''; recalc(); return; }
  c.innerHTML = state.items.map(it => renderItem(it)).join('');
  recalc();
}

  if(!extraRows) extraRows = '<tr><td colspan="5" style="padding:8px;color:#8A8578;font-size:12px;">Нет строк</td></tr>';

      <td class="num">${mat?mat.price:0} ₽</td>

          <input type="checkbox" ${it.masterCuts?'checked':''} onchange="updateItem('${it.id}','masterCuts',this.checked)">
          Кроит сама
        </label>
      </div>
    </div>`;
}

    .grand{text-align:right;font-size:14px;font-weight:700;padding:12px 6px;border-top:3px double #000;border-bottom:3px double #000;margin-top:14px;}
    .markups{font-size:11px;margin:10px 0;}
  </style></head><body>`;

  html += `<h1>РАСЧЁТ СТОИМОСТИ ПОШИВА</h1><div class="hdr">`;
  if(state.orderNum) html += `<span><b>Заказ №:</b> ${state.orderNum}</span>`;
  if(state.readyDate) html += `<span><b>Дата готовности:</b> ${state.readyDate}</span>`;
  if(state.designer) html += `<span><b>Дизайнер:</b> ${state.designer}</span>`;

    const itemName = it.itemName || 'Изделие';
    html += `<div class="title">${roomName}. ${itemName}</div>`;
    html += `<table><thead><tr><th>Описание</th><th class="r">Кол-во</th><th class="r">Цена, р</th><th class="r">Стоимость, р</th></tr></thead><tbody>`;
    c.mainLinesData.forEach(l=>{
      html += `<tr><td>${l.name}</td><td class="r">${l.qty.toFixed(2)}</td><td class="r">${l.price}</td><td class="r">${fmt(l.sum)}</td></tr>`;
    });
    c.extrasData.forEach(l=>{
      html += `<tr><td>${l.name}</td><td class="r">${l.qty.toFixed(2)}</td><td class="r">${l.price}</td><td class="r">${fmt(l.sum)}</td></tr>`;
    });
    c.materialsData.forEach(l=>{
      html += `<tr><td>${l.name}</td><td class="r">${l.qty.toFixed(2)}</td><td class="r">${l.price}</td><td class="r">${fmt(l.sum)}</td></tr>`;
    });
    c.volumeMarkupsList.forEach(m=>{
      html += `<tr><td>${m.name}</td><td class="r">—</td><td class="r">—</td><td class="r">${fmt(m.sum)}</td></tr>`;
    });
    html += `</tbody></table>`;
    html += `<div class="total">Итого: ${fmt(c.total)}</div>`;
  });

  if(state.urgency50 || state.urgency100){
    html += `<div class="markups">`;
    if(state.urgency50) html += `<div>Срочность (+50%): ${fmt(itemsTotal*0.5)}</div>`;
    if(state.urgency100) html += `<div>Очень срочно (+100%): ${fmt(itemsTotal*1.0)}</div>`;
    html += `</div>`;
  }
  html += `<div class="grand">ВСЕГО К ОПЛАТЕ: ${fmt(gt)}</div>`;
  html += `</body></html>`;
  return html;
}

function printDoc(){
  const html = buildPrintHtml();
  // Открываем новое окно — на iPad/iPhone это работает лучше, чем window.print()
  const w = window.open('', '_blank');
  if(w){
    w.document.write(html);
    w.document.close();
    // Автоматически вызываем печать после загрузки
    setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 300);
  } else {
    // Fallback — сохранить как файл
    downloadHtml(html, 'Расчёт_' + (state.orderNum||'заказ') + '.html');
  }
}

function printMasters(){
  const html = buildMastersHtml();
  const w = window.open('', '_blank');
  if(w){
    w.document.write(html);
    w.document.close();
    setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 300);
  } else {
    downloadHtml(html, 'ЗП_' + (state.orderNum||'заказ') + '.html');
  }
}

function downloadHtml(html, filename){
  const blob = new Blob([html],{type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// ==================== ВЕДОМОСТЬ ЗП ====================
function calcMasters(){
  const masters = [
    {name:'Швея 1',sum:0,items:0},
    {name:'Швея 2',sum:0,items:0},
    {name:'Швея 3',sum:0,items:0},
    {name:'Закройщик',sum:0,items:0}
  ];
  let totalWork = 0, totalMaterials = 0;
  state.items.forEach(it=>{
    const c = calcItem(it);
    const workSum = c.workVolume + c.volumeMarkupsSum;
    totalWork += workSum;
    totalMaterials += c.materialsSum;
    const fund = workSum / 2;
    const mi = it.masterIdx;
    if(mi === 3) return;
    if(it.masterCuts){
      masters[mi].sum += fund;
      masters[mi].items += 1;
    } else {
      masters[mi].sum += fund * 0.7;
      masters[3].sum += fund * 0.3;
      masters[mi].items += 1;
      masters[3].items += 1;
    }
  });
  const totalFund = totalWork / 2;
  const profit = totalWork / 2;
  return {masters, totalWork, totalMaterials, totalFund, profit};
}

// ==================== ХРАНЕНИЕ ====================
const STORAGE_KEY = 'curtain_calc_v3';

function getSaved(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }catch(e){ return []; } }
function setSaved(a){ localStorage.setItem(STORAGE_KEY, JSON.stringify(a)); }

function saveToCloud(){
  syncHeader();
  const orders = getSaved();
  const order = {id:'o_'+Date.now(), savedAt:new Date().toISOString(), state:JSON.parse(JSON.stringify(state))};
  const eIdx = orders.findIndex(o=>o.state.orderNum && o.state.orderNum===state.orderNum && o.state.projectName===state.projectName);
  if(eIdx>=0) orders[eIdx] = order; else orders.push(order);
  setSaved(orders);
  alert('Расчёт сохранён');
}

function showSaved(){
  const panel = document.getElementById('savedPanel');
  const list = document.getElementById('savedList');
  const orders = getSaved().slice().reverse();
  if(!orders.length){
    list.innerHTML = '<div style="padding:16px;text-align:center;color:#8A8578;">Нет сохранённых расчётов</div>';
  } else {
    list.innerHTML = orders.map(o=>{
      const st = o.state;
      let total = 0;
      (st.items||[]).forEach(it=>{ total += calcItem(it).total; });
      const date = new Date(o.savedAt).toLocaleDateString('ru-RU');
      return `<div class="saved-item">
        <div class="saved-info">
          <div class="saved-name">${st.orderNum?('№ '+st.orderNum+' — '):''}${st.projectName||'Без названия'}</div>
          <div class="saved-date">${date}${st.designer?' · '+st.designer:''}</div>
        </div>
        <div class="saved-sum">${fmt(total)}</div>
        <button class="mini" onclick="loadOrder('${o.id}')">Открыть</button>
        <button class="danger" onclick="deleteOrder('${o.id}')">X</button>
      </div>`;
    }).join('');
  }
  panel.style.display = 'block';
}
function hideSaved(){ document.getElementById('savedPanel').style.display = 'none'; }

function loadOrder(id){
  const order = getSaved().find(o=>o.id===id);
  if(!order){ alert('Не найден'); return; }
  state = JSON.parse(JSON.stringify(order.state));
  document.getElementById('orderNum').value = state.orderNum||'';
  document.getElementById('readyDate').value = state.readyDate||'';
  document.getElementById('designer').value = state.designer||'';
  document.getElementById('projectName').value = state.projectName||'';
  document.getElementById('urgency50').checked = state.urgency50||false;
  document.getElementById('urgency100').checked = state.urgency100||false;
  hideSaved();
  render();
}

function deleteOrder(id){
  if(!confirm('Удалить?')) return;
  setSaved(getSaved().filter(o=>o.id!==id));
  showSaved();
}

function newOrder(){
  if(!confirm('Начать новый расчёт?')) return;
  state = {orderNum:'',readyDate:'',designer:'',projectName:'',items:[],urgency50:false,urgency100:false};
  document.getElementById('orderNum').value='';
  document.getElementById('readyDate').value='';
  document.getElementById('designer').value='';
  document.getElementById('projectName').value='';
  document.getElementById('urgency50').checked=false;
  document.getElementById('urgency100').checked=false;
  itemCounter = 0;
  hideSaved();
  render();
}

function exportBackup(){
  const json = JSON.stringify(getSaved(), null, 2);
  const blob = new Blob([json],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date().toLocaleDateString('ru-RU').replace(/\./g,'-');
  a.href = url;
  a.download = 'Заказы_'+d+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
      try{
        const imported = JSON.parse(ev.target.result);
        if(!Array.isArray(imported)) throw new Error('Неверный формат');
        if(!confirm('Добавить '+imported.length+' расчётов?')) return;
        setSaved(getSaved().concat(imported));
        alert('Импортировано: '+imported.length);
        showSaved();
      }catch(err){ alert('Ошибка: '+err.message); }
    };
    r.readAsText(f);
  };
  input.click();
}

// ==================== СОБЫТИЯ ====================
document.getElementById('orderNum').addEventListener('input',e=>state.orderNum=e.target.value);
document.getElementById('readyDate').addEventListener('input',e=>state.readyDate=e.target.value);
document.getElementById('designer').addEventListener('input',e=>state.designer=e.target.value);
document.getElementById('projectName').addEventListener('input',e=>state.projectName=e.target.value);

render();
</script>
